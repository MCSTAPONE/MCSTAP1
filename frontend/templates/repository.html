<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Repository Assets
    </title>

    <link rel="stylesheet" href="/static/css/repository.css">

</head>

<body>

<div class="container">

    <h2>
        Repository Assets
    </h2>

    <table>

        <thead>

            <tr>

                <th>ID</th>

                <th>Asset Name</th>

                <th>Module</th>

                <th>Transaction</th>

                <th>Business Object</th>

                <th>Operation</th>

                <th>Status</th>
		    
		    <th>Action</th>

            </tr>

        </thead>

        <tbody>

        {% for asset in assets %}

            <tr>

			<td>{{asset[0]}}</td>

			<td>{{asset[1]}}</td>

			<td>{{asset[2]}}</td>

			<td>{{asset[3]}}</td>

			<td>{{asset[4] or ''}}</td>

			<td>{{asset[5] or ''}}</td>

			<td>{{asset[6]}}</td>

			<td>
			    <a href="/repository/edit/{{asset[0]}}">
				  Edit
			    </a>
			</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
