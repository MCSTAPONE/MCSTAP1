<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Repository Asset</title>
    <link rel="stylesheet" href="/static/css/repository.css">
</head>

<body>

<div class="container">
    <h2>Edit Asset</h2>

    <form action="/repository/update/{{asset[0]}}" method="POST" class="edit-form">

        <p>
            Asset Name
            <br>
            <input type="text" name="asset_name" value="{{ asset[1] }}" required>
        </p>

        <p>
            Module
            <br>
            <input type="text" name="module" value="{{ asset[2] }}" required>
        </p>

        <p>
            Transaction
            <br>
            <input type="text" name="transaction_code" value="{{ asset[3] }}" required>
        </p>

        <p>
            Business Object
            <br>
            <select name="business_object">
                <option value="COSTCENTER" {% if asset[4] == 'COSTCENTER' %}selected{% endif %}>COSTCENTER</option>
                <option value="WORKORDER" {% if asset[4] == 'WORKORDER' %}selected{% endif %}>WORKORDER</option>
                <option value="SALESORDER" {% if asset[4] == 'SALESORDER' %}selected{% endif %}>SALESORDER</option>
                <option value="PURCHASEORDER" {% if asset[4] == 'PURCHASEORDER' %}selected{% endif %}>PURCHASEORDER</option>
                <option value="MATERIAL" {% if asset[4] == 'MATERIAL' %}selected{% endif %}>MATERIAL</option>
            </select>
        </p>

        <p>
            Operation
            <br>
            <select name="operation">
                <option value="CREATE" {% if asset[5] == 'CREATE' %}selected{% endif %}>CREATE</option>
                <option value="CHANGE" {% if asset[5] == 'CHANGE' %}selected{% endif %}>CHANGE</option>
                <option value="DISPLAY" {% if asset[5] == 'DISPLAY' %}selected{% endif %}>DISPLAY</option>
                <option value="DELETE" {% if asset[5] == 'DELETE' %}selected{% endif %}>DELETE</option>
                <option value="LIST" {% if asset[5] == 'LIST' %}selected{% endif %}>LIST</option>
            </select>
        </p>

        <p>
            Description
            <br>
            <textarea name="description" rows="5" cols="80">{{ asset[6] or '' }}</textarea>
        </p>

        <p>
            Asset Script
            <br>
            <textarea name="asset_script" rows="20" cols="120">{{ asset[7] or '' }}</textarea>
        </p>

        <div class="form-actions" style="display: flex; justify-content: flex-end; width: 100%; max-width: 960px; margin-top: 20px;">
	    <button type="submit" class="btn-save">
		  Save
	    </button>
	  </div>

    </form>
</div>

</body>
</html>
