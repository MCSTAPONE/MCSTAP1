<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Library | MC STAP</title>
    <link rel="stylesheet"
          href="/static/css/flow_library.css">
</head>

<body>

    <div class="header">
        <h1>Flow Library</h1>
        <a href="/dashboard" class="nav-btn">← Dashboard</a>
    </div>

    <div class="main-container">

        <!-- Toolbar & Filter Panel -->
        <div class="filter-card">
            <form method="get" class="filter-form">
                <input type="text" name="search" class="search-input" value="{{ search }}" placeholder="🔍 Search flow name...">

                <select name="module" id="module">
                    <option value="" {% if selected_module == "" %}selected{% endif %}>All Modules</option>
                    <option value="PM" {% if selected_module == "PM" %}selected{% endif %}>Plant Maintenance (PM)</option>
                    <option value="MM" {% if selected_module == "MM" %}selected{% endif %}>Material Management (MM)</option>
                    <option value="CO" {% if selected_module == "CO" %}selected{% endif %}>Controlling (CO)</option>
                    <option value="FI" {% if selected_module == "FI" %}selected{% endif %}>Finance (FI)</option>
                    <option value="SD" {% if selected_module == "SD" %}selected{% endif %}>Sales & Distribution (SD)</option>
                    <option value="PP" {% if selected_module == "PP" %}selected{% endif %}>Production Planning (PP)</option>
                    <option value="QM" {% if selected_module == "QM" %}selected{% endif %}>Quality Management (QM)</option>
                    <option value="WM" {% if selected_module == "WM" %}selected{% endif %}>Warehouse Management (WM)</option>
                    <option value="TR" {% if selected_module == "TR" %}selected{% endif %}>Treasury (TR)</option>
                    <option value="LO" {% if selected_module == "LO" %}selected{% endif %}>Logistics (LO)</option>
                    <option value="PLM" {% if selected_module == "PLM" %}selected{% endif %}>Product Lifecycle Mgmt (PLM)</option>
                    <option value="SCM" {% if selected_module == "SCM" %}selected{% endif %}>Supply Chain Mgmt (SCM)</option>
                    <option value="PROC" {% if selected_module == "PROC" %}selected{% endif %}>Procurement (PROC)</option>
                    <option value="E2E" {% if selected_module == "E2E" %}selected{% endif %}>End-To-End (E2E)</option>
                </select>

                <button type="submit" class="btn-primary">Search</button>
            </form>

            <a href="/flow-library/new" class="btn-primary">+ New Flow</a>
        </div>

        <!-- Flow Items Grid -->
        <div class="flow-grid">
            {% for flow in flows %}
            <div class="flow-card">
                <div>
                    <div class="flow-header">
                        <h3 class="flow-title">{{ flow[1] }}</h3>
                        <span class="badge-module">{{ flow[3] }}</span>
                    </div>

                    <div class="flow-desc">{{ flow[2] }}</div>
                </div>

                <div>
                    <div class="flow-meta">
                        <span>Status</span>
                        <span class="status-tag">{{ flow[4] }}</span>
                    </div>

                    <div class="card-actions">
                        <a href="/flow-library/{{ flow[0] }}" class="btn-outline">Open Flow</a>
                        <a href="/flow-library/edit/{{ flow[0] }}" class="btn-secondary">Edit</a>
                        <a href="/flow-library/delete/{{ flow[0] }}" class="btn-danger" onclick="return confirm('Are you sure you want to delete this flow?');">Delete</a>
                    </div>
                </div>
            </div>
            {% else %}
            <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); background: white; border-radius: 8px;">
                No flows found matching your search criteria.
            </div>
            {% endfor %}
        </div>

    </div>

</body>

</html>
